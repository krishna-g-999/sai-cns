# Tests on every push.
#
#   test    the scientific core, on a clean machine, with no models present. Fast, runs everywhere,
#           and is the gate. The integration suite skips itself when models_rf/ is absent, which is
#           the normal state of a fresh clone, and a skip is visible in the log.
#
# The container is built but not run against real models, because the image fetches 0.84 GB at build
# time from a published archive and that archive has no URL yet. The build is still worth doing: it
# catches a broken Dockerfile, which is otherwise found at deploy time.
#
# A "smoke reproduction" job used to run here, rebuilding the manuscript to prove the pipeline from
# raw artefact to submitted document still reproduces. This repository ships the tool the manuscript
# describes, not the manuscript itself, so there is no longer a manuscript here for that job to
# rebuild; the check it performed belongs to the private working repository instead.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is what the container runs; Windows is what the work is developed on. Both, because
        # a path-separator bug that only appears on one of them is a real class of defect here.
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Record the environment being tested
        run: |
          python -c "import sys, platform; print(sys.version); print(platform.platform())"
          python -m pip freeze

      - name: Unit tests with coverage on the scientific core
        run: >
          python -m pytest tests/ -v
          --cov=src/sai_cns/features --cov=src/sai_cns/models
          --cov-report=term-missing --cov-report=xml
        shell: bash

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  container:
    name: container builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # No push and no model fetch: SAI_CNS_SKIP_MODEL_FETCH is set inside the image, and the
        # build-time fetch needs a published archive URL that does not exist yet. Building proves
        # the Dockerfile and the dependency set are sound.
        run: docker build --build-arg SKIP_MODEL_FETCH=1 -t sai-cns:ci .
        continue-on-error: true

      - name: Report image size
        run: docker images sai-cns:ci || true
