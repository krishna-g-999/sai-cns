# Build the published SAI-CNS image and push it to the GitHub Container Registry.
#
# ghcr.io rather than Azure Container Registry for one concrete reason: ACR Tasks, the cloud
# build service, is not permitted on Azure for Students subscriptions, and there is no Docker
# daemon available on the machines this project is developed and deployed from. GitHub's runners
# have one, and pushing to ghcr.io authenticates with the automatically provided GITHUB_TOKEN,
# so no registry secret has to be created or rotated.
#
# The build downloads the 0.87 GB model archive from the URL recorded in models_manifest.json
# and verifies every one of the 252 files against its checksum. A runner has the disk and the
# bandwidth for that; it takes a few minutes.
name: build-container

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "api.py"
      - "model_fetch.py"
      - "models_manifest.json"
      - "src/**"
      - "assets/**"
      - ".streamlit/**"
      - "results/tables/**"
      - "inversion/results/**"
      - "deploy/container/**"
      - ".github/workflows/build-container.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The default runner image ships several gigabytes of toolchains this build never uses,
      # and the model archive plus the image layers need the room.
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/container/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          provenance: false

      - name: Report
        run: |
          echo "Pushed ghcr.io/${{ github.repository }}:latest"
          echo "and    ghcr.io/${{ github.repository }}:${{ github.sha }}"
